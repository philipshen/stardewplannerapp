name: iOS TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a signing/upload operation. New pending runs replace older
# pending runs, so the latest main commit is released next.
concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node --import tsx --test scripts/test-model.ts scripts/test-art.ts
      - name: Fastlane local build and TestFlight submission
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: bash scripts/release-ios.sh
